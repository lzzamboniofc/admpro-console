name: AdmPro Console PR checks
on:
  push:
    branches: [feature/multiusuario-multiprofissional]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verificar JavaScript, renderização e segurança
        run: |
          node tests/static-check.mjs
          node tests/view-render.mjs
          node tests/ajustes-interface.mjs
      - name: Validar vendor Supabase
        run: |
          node --check js/vendor/supabase.js
          sha256sum -c js/vendor/supabase.js.sha256
