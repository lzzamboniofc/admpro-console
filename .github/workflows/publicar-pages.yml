name: Publicar AdmPro Console no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: admpro-console-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verificar frontend, segurança estática e integridade da UMD
        run: |
          node tests/static-check.mjs
          node tests/view-render.mjs
          node tests/ajustes-interface.mjs
          node --check js/vendor/supabase.js
          sha256sum -c js/vendor/supabase.js.sha256
      - name: Empacotar somente frontend (não publicar SQL nem documentos internos)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R css img js _site/
          test -s _site/js/vendor/supabase.js
          test ! -e _site/supabase
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
