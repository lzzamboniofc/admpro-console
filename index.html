<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073f50">
  <meta name="description" content="AdmPro Console — administração de assinaturas e suporte">
  <title>AdmPro Console</title>
  <link rel="icon" type="image/svg+xml" href="img/logo/simbolo.svg">
  <link rel="stylesheet" href="css/style.css?v=20261028-pix-inbox">
</head>
<body>
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <img class="logo-light" src="img/logo/logo-horizontal.svg" alt="AdmPro" width="180" height="52"><img class="logo-dark" src="img/logo/logo-horizontal-escuro.svg" alt="AdmPro" width="180" height="52"><span class="console-label">CONSOLE</span>
      <h1>Área administrativa</h1><p>Entre com uma conta autorizada para administrar o AdmPro.</p>
      <form id="login-form">
        <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Entrar</button>
        <p class="error-text" id="login-error" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>
  <div id="console" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn menu-trigger" id="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <a class="brand" href="#/inicio"><img class="logo-light" src="img/logo/logo-horizontal.svg" width="142" height="40" alt="AdmPro"><img class="logo-dark" src="img/logo/logo-horizontal-escuro.svg" width="142" height="40" alt="AdmPro"><span class="console-label">Console</span></a>
      <div class="top-actions"><span class="top-email" id="user-email"></span><button id="theme-toggle" type="button" class="icon-btn" aria-label="Alternar tema">◐</button><button type="button" id="logout" class="btn outline compact">Sair</button></div>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <nav id="side-nav">
        <a href="#/inicio" data-route="inicio">▦ <span>Visão geral</span></a>
        <a href="#/contas" data-route="contas">▤ <span>Contas</span></a>
        <a href="#/pagamentos" data-route="pagamentos">▣ <span>Pagamentos <b id="payments-count" class="count" hidden aria-label="Solicitações de plano pendentes"></b></span></a>
        <a href="#/planos" data-route="planos">◇ <span>Planos</span></a>
        <a href="#/avisos" data-route="avisos">◈ <span>Avisos</span></a>
         <a href="#/automacoes" data-route="automacoes">⏱ <span>Automações</span></a>
        <a href="#/suporte" data-route="suporte">✉ <span>Suporte <b id="support-count" class="count" hidden></b></span></a>
        <a href="#/configuracoes" data-route="configuracoes">⚙ <span>Configurações</span></a>
      </nav>
      <small>Console administrativo · acesso restrito</small>
    </aside>
    <div id="backdrop" class="backdrop" hidden></div>
    <main id="main" class="main" tabindex="-1" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-btn" type="button" aria-label="Fechar">✕</button></div><div id="modal-body"></div></dialog>
  <!-- Apenas biblioteca UMD local, sem CDN ou build. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js?v=20261028-pix-inbox"></script>
  <script src="js/contas.js"></script>
  <script src="js/gestao.js?v=20261028-pix-inbox"></script>
  <script src="js/automacoes.js"></script>
   <script src="js/bootstrap.js?v=20261028-pix-inbox"></script>
</body>
</html>
